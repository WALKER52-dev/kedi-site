<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anneee 🐱❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         ANA EKRAN
    ========================== -->

    <main id="mainScreen" class="screen active">

        <div class="paw paw1">🐾</div>
        <div class="paw paw2">🐾</div>
        <div class="paw paw3">🐾</div>

        <div class="main-content">

            <h1>Anneee 🥺</h1>

            <p class="question">
                Bana bir kedi alır mısın? 🐱❤️
            </p>

            <p class="subtext">
                Söz veriyorum, çok güzel bakacağım... 🥹
            </p>

            <div class="cats">

                <div class="cat-card">
                    <img src="images/kedi1.jpg" alt="Sevimli kedi">
                </div>

                <div class="cat-card">
                    <img src="images/kedi2.jpg" alt="Sevimli kedi">
                </div>

            </div>

            <div class="buttons">

                <button id="yesButton" class="yes-button">
                    EVET ❤️
                </button>

                <button id="noButton" class="no-button">
                    HAYIR 😭
                </button>

            </div>

            <p id="escapeText" class="escape-text"></p>

        </div>

    </main>


    <!-- =========================
         EVET EKRANI
    ========================== -->

    <main id="yesScreen" class="screen">

        <div id="confettiContainer"></div>

        <div class="celebration">

            <div class="emoji-rain">
                🐾 ❤️ 🐾 ❤️ 🐾
            </div>

            <h1>
                YAAAAŞASINNN! 🎉
            </h1>

            <p class="big-text">
                KEDİMİZ OLUYOR!!! 🐱❤️
            </p>

            <div class="happy-cat">
                <img src="images/kedi3.jpg" alt="Mutlu kedi">
            </div>

            <p class="love-text">
                Teşekkür ederim anne ❤️
            </p>

            <div class="hearts">
                ❤️ 💕 💗 💖 💕 ❤️
            </div>

        </div>

    </main>


    <!-- =========================
         HAYIR EKRANI
    ========================== -->

    <main id="noScreen" class="screen">

        <div class="sad-container">

            <div class="sad-emoji">
                😿
            </div>

            <h1>
                Anne... gerçekten mi?
            </h1>

            <p class="sad-title">
                Bu kediler bunu hak edecek ne yaptı? 🥺
            </p>

            <div class="sad-cats">

                <div class="sad-cat">
                    <img src="images/kedi4.jpg" alt="Üzgün kedi">
                </div>

                <div class="sad-cat">
                    <img src="images/kedi5.jpg" alt="Üzgün kedi">
                </div>

            </div>

            <p class="sad-text">
                Bak yüzlerine... 😭🐱
            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
